<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="%ROBOTS%" />
    <meta name="theme-color" content="#0A0614" />
    <meta name="description" content="Eli's REDLINE // OVERDRIVE portfolio reference. Software projects, AI experiments and an original ASCII interface for Lain." />
    <!-- The policy is set as a meta tag because GitHub Pages does not read
         the _headers file. The build fills in the script hashes, so the
         policy can never stop matching the scripts that are really there. -->
    <meta http-equiv="Content-Security-Policy" content="%POLICY%" />
    <link rel="icon" href="./favicon.ico" />
    <title>ELI / REDLINE // OVERDRIVE</title>
    <script>
      // Reserve the entrance animation before first paint, so the title
      // sequence never flashes its final state. The failsafe releases the
      // content if the motion runtime cannot load.
      (function () {
        var root = document.documentElement;
        if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
        root.classList.add('hero-pending');
        root.classList.add('reveal-pending');
        window.__motionFailsafe = setTimeout(function () {
          root.classList.remove('hero-pending');
          root.classList.remove('reveal-pending');
        }, 4000);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>This reference requires JavaScript for its project selector and scripted Lain interface. No model service or personal information is loaded.</noscript>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
