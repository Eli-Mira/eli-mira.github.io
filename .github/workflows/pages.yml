name: GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
        env:
          # The published site is meant to be indexed. The local reference
          # build keeps noindex.
          PUBLIC_ROBOTS: index, follow

      - name: Check the built output
        run: npm run test:built

      - name: Check the released tree is unchanged
        run: npm run test:integrity

      - name: Check the bundle budget
        run: npm run test:budget

      - name: Cache the browser
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ hashFiles('package-lock.json') }}

      - name: Install the browser
        run: npx playwright install --with-deps chromium

      - name: Browser checks against the built site
        run: |
          node scripts/serve-with-headers.mjs 4180 &
          server=$!
          for attempt in $(seq 1 30); do
            if curl -sf http://127.0.0.1:4180/ > /dev/null; then break; fi
            sleep 1
          done
          REDLINE_PREVIEW_URL=http://127.0.0.1:4180/ node tests/browser-smoke.mjs
          kill $server

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
